[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; 日志走原生 USB 口（板上标 USB 的那个口）：
; COM 口的 CH343 只管烧录；看日志/敲命令都在 USB 口
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 双 OTA 槽 + 2.94MB LittleFS 存本地音频
board_build.partitions = partitions_8mb_ota.csv
board_build.filesystem = littlefs

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit NeoPixel@^1.15.5
    adafruit/Adafruit AHTX0@^2.0.6
    adafruit/Adafruit SSD1306@^2.5.17   ; V2 OLED 状态屏（GFX/BusIO 由 PIO 自动解析依赖）
    ; ESP8266Audio 2.4.1 依赖 IDF5 的 driver/i2s_std.h，与当前 core 2.0.17 不兼容，
    ; 已暂时移除。第 3 阶段做 MP3 时再评估（换 platform 或换库）
